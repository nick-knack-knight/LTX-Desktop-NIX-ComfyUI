[project]
name = "ltx-desktop-backend"
version = "1.0.0"
description = "LTX Desktop Backend — ComfyUI edition"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    # Data / validation
    "pydantic>=2.7.0",
    # HTTP client (HTTPClientImpl, LTX API fallback, ComfyUI calls)
    "requests>=2.31.0",
    # Image handling (I2V conditioning image prep)
    "pillow>=10.3.0",
    # Video processing (VideoProcessorImpl — timeline editor, frame extraction)
    "opencv-python-headless>=4.8.0",
    # Model download UI (optional in ComfyUI mode; still user-initiated)
    "huggingface-hub>=0.23.0",
    "tqdm>=4.66.0",
    # GPU info / health endpoint (lazy-imported; harmless if CUDA absent)
    "pynvml>=11.5.0; sys_platform != 'darwin'",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27"]
dev = ["pyright>=1.1.380", "debugpy>=1.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
